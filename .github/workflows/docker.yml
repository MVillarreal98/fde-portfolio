name: docker-suite

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_DIR: projects/llm-support-desk
  IMAGE: ghcr.io/mvillarreal98/support-desk   # GHCR requires lowercase image names

jobs:
  # 1) Unit tests run inside the image build (the `test` stage), against the same venv the runtime ships.
  container-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) The runtime image starts without Ollama and its HEALTHCHECK reports healthy (degraded mode).
  container-smoke:
    needs: container-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image (requires the test stage to pass)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          load: true
          push: false
          tags: support-desk:ci
          cache-from: type=gha
      - name: Run without Ollama and wait for the healthcheck
        run: |
          docker run -d --name desk -p 8000:8000 support-desk:ci
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' desk)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:8000/api/health
      - name: Container logs
        if: always()
        run: docker logs desk || true

  # 3) On pushes to main: publish the runtime image to GHCR.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container-test, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
