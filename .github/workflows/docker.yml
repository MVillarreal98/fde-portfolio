name: docker-suite

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  APP_DIR: projects/llm-support-desk
  IMAGE: ghcr.io/mvillarreal98/support-desk   # GHCR requires lowercase image names

jobs:
  # 1) Unit tests run inside the very image that ships — no environment drift.
  container-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) On main: publish the runtime image so the deploy step is a pull, not a rebuild.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: container-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
