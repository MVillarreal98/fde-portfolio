name: portfolio-ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconciliation-engine:
    name: reconciliation-engine (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pandas-2
            pandas: "pandas>=2.3,<3"
          - label: pandas-3
            pandas: "pandas>=3,<4"
    defaults:
      run:
        working-directory: projects/reconciliation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/reconciliation-engine/pyproject.toml
      - name: Install the package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.pandas }}"
          python -c "import pandas, numpy, duckdb; print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| duckdb', duckdb.__version__)"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests with coverage (gate and filterwarnings=error live in pyproject.toml)
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term
      - name: Smoke - installed CLI reproduces sample_output
        run: |
          reconcile --ops data/ops_transactions.csv --billing data/billing_statements.csv --out "$RUNNER_TEMP/recon"
          diff -r "$RUNNER_TEMP/recon" sample_output
      - name: Smoke - SQL engine exits 2 when there are findings
        run: |
          set +e
          reconcile --ops data/ops_transactions.csv --billing data/billing_statements.csv \
            --out "$RUNNER_TEMP/recon-sql" --engine sql --fail-on-findings
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

  llm-support-desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-support-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/llm-support-desk/requirements-dev.txt
      - name: Install dev tooling (the runtime is stdlib-only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests with coverage (no Ollama or network needed)
        run: python -m pytest -q -p no:cacheprovider --cov=src/support_desk --cov-branch --cov-report=term --cov-fail-under=95

  collections-aging-sql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/collections-aging-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/collections-aging-sql/pyproject.toml
      - name: Install the package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests with coverage (85% branch-coverage gate lives in pyproject.toml)
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term
      - name: Smoke - installed CLI reproduces sample_output
        run: |
          collections-aging --invoices data/invoices.csv --payments data/payments.csv --out "$RUNNER_TEMP/aging"
          diff -r "$RUNNER_TEMP/aging" sample_output
      - name: Smoke - CLI exits 2 under --fail-on-findings when findings exist
        run: |
          set +e
          collections-aging --invoices data/invoices.csv --payments data/payments.csv \
            --out "$RUNNER_TEMP/aging-fail" --fail-on-findings
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

  iphone-vs-samsung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/iphone-vs-samsung
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Stdlib-only pipeline: pytest is the only tool installed. The job runs
      # the matching-precedence unit tests plus the pipeline itself as smoke.
      - name: Unit tests of the Trends match rules
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -p no:cacheprovider
      - name: Build base, sanity checks and map must run clean
        run: |
          python scripts/build_db.py
          test -f db/iphone_vs_samsung.sqlite
          res=$(sqlite3 db/iphone_vs_samsung.sqlite < sql/02_sanity_checks.sql)
          test -z "$res"
          python scripts/mapa_mty.py
          test -s insights/mapa_mty.html

  file-layout-automator:
    runs-on: windows-latest   # the WPF app, the CLI and the tests target net8.0-windows
    defaults:
      run:
        working-directory: projects/file-layout-automator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build app, CLI and tests (warnings are errors)
        run: dotnet build DocumentLayoutAutomator.sln --nologo -warnaserror
      - name: Tests (engine, runner, golden sample_output)
        run: dotnet test tests --nologo --no-build
      - name: Smoke - CLI writes the layout for clean input (exit 0)
        run: dotnet run --project tools/LayoutCli --no-build -- --profile deposit_guide --source data/sample_input_cleaned.csv --out "$env:RUNNER_TEMP/layout"
      - name: Smoke - CLI rejects the planted bad rows and writes nothing (exit 1)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "layout-rejected"
          dotnet run --project tools/LayoutCli --no-build -- --profile deposit_guide --source data/sample_input.csv --out $out
          $code = $LASTEXITCODE
          Write-Output "exit code: $code"
          if ($code -ne 1) { Write-Output "expected exit code 1"; exit 1 }
          if (Test-Path (Join-Path $out "sample_input_deposit_guide.txt")) { Write-Output "a layout file was written"; exit 1 }
          exit 0
