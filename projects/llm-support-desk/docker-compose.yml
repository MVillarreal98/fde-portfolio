# Full local deployment: model server + one-shot model pull + triage API.
# `docker compose up` gives a working desk at http://localhost:8000.
# The desk only waits for the Ollama server to START, not for the model pull:
# until the model is available it answers from the deterministic fallback
# (/api/health reports "degraded"), so an offline host still gets a working desk.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama   # model weights survive restarts
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  model-init:
    image: ollama/ollama:latest
    entrypoint: sh -c "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$${MODEL}\" && echo 'model ready'"
    environment:
      MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  support-desk:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      SUPPORT_DESK_DB: /data/decisions.db
    volumes:
      - desk-data:/data        # SQLite decision log survives restarts
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama:
  desk-data:
