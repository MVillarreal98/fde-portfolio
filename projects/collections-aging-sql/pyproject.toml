[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "collections-aging-sql"
version = "1.2.0"
description = "Collections aging, dunning states and cash application as DuckDB SQL, with conservation checks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Linters pinned so CI, pre-commit and local runs agree (.pre-commit-config.yaml pins ruff too).
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[project.scripts]
collections-aging = "aging_sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aging_sql = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aging_sql"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
